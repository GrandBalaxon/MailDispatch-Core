{% extends 'base.html' %}

{% block content %}
<div class="container flex-grow-1">

    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Удаление получателя</h1>
        <p class="lead">Вы действительно хотите удалить <strong>{{ recipient.full_name }}</strong>?</p>
    </div>

    <div class="row text-center gy-4">

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'core:recipient_details' pk=recipient.id %}" class="btn btn-lg btn-outline-secondary">Отмена</a>
                <button type="submit" class="btn btn-lg btn-danger">Удалить</button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
